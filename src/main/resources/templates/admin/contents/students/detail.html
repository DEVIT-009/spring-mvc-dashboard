<div
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{admin/index}"
        layout:fragment="content"
>
  <!-- Content Header -->
  <section class="content-header">
    <h1>
      Student Detail
      <small>View student information</small>
    </h1>
    <ol class="breadcrumb">
      <li>
        <a href="#"><i class="fa fa-dashboard"></i> Home</a>
      </li>
      <li><a href="#">Students</a></li>
      <li class="active">Detail</li>
    </ol>
  </section>

  <!-- Main content -->
  <section class="content">
    <div class="row">
      <div class="col-md-12">
        <div class="box box-info">
          <div class="box-header with-border">
            <h3 class="box-title">Student Information</h3>
          </div>

          <div class="box-body">
            <div class="row">
              <!-- Full Name -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Full Name</label>
                  <p class="form-control-static" th:text="${student.firstName} + ' ' + ${student.lastName}">
                    John Doe
                  </p>
                </div>
              </div>

              <!-- Email -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Email</label>
                  <p class="form-control-static" th:text="${student.email}">
                    john@example.com
                  </p>
                </div>
              </div>

              <!-- Gender -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Gender</label>
                  <p class="form-control-static" th:text="${student.gender}">
                    MALE
                  </p>
                </div>
              </div>

              <!-- Date of Birth -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Date of Birth</label>
                  <p class="form-control-static" >
                    not doing it yet
                  </p>
                </div>
              </div>

              <!-- Address -->
              <div class="col-md-12 col-sm-12">
                <div class="form-group">
                  <label>Address</label>
                  <p class="form-control-static" th:text="${student.address}">
                    123 Main Street, Phnom Penh
                  </p>
                </div>
              </div>

              <!-- Subject Name -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Subject</label>
                  <p class="form-control-static" th:text="${student.subjectName}">
                    Mathematics
                  </p>
                </div>
              </div>

              <!-- Image -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Profile Image</label>
                  <img
                          th:if="${not #strings.isEmpty(student.imagePath)}"
                          th:src="@{'/uploads/students/' + ${student.imagePath}}"
                          alt="Student Photo"
                          style="
                        width: 50px;
                        height: 50px;
                        object-fit: cover;
                        border-radius: 50%;
                        border: 2px solid #ddd;
                    "
                  />
                  <span th:if="${#strings.isEmpty(student.imagePath)}">
                      -- No Image --
                  </span>
                </div>
              </div>

              <!-- Created At -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Created At</label>
                  <p
                          class="form-control-static"
                  >
                    Not Yet
                  </p>
                </div>
              </div>

              <!-- Updated At -->
              <div class="col-md-6 col-sm-12">
                <div class="form-group">
                  <label>Last Updated</label>
                  <p
                          class="form-control-static"
                  >
                    Not Yet
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Footer -->
          <div class="box-footer">
            <a th:href="@{/admin/v1/students/manage}" class="btn btn-default">
              <i class="fa fa-arrow-left"></i> Back
            </a>

            <a
                    th:href="@{/admin/v1/students/edit/{id}(id=${student.id})}"
                    class="btn btn-warning pull-right"
            >
              <i class="fa fa-edit"></i> Edit Student
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
